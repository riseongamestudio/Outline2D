name: Release

# A pushed tag publishes its package version as a release of this repo, which the RiseOn UPM registry indexes.
on:
  push:
    tags: ["**"]

jobs:
  release:
    uses: riseongamestudio/upm/.github/workflows/pack-release.yml@main
    # The organization's UPM_INDEX_TOKEN, which lets it index the release at once.
    secrets: inherit
    permissions:
      contents: write